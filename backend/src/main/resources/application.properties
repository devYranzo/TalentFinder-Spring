spring.application.name=talentfinder

# --- Secretos: admite ejecutar desde la raíz del proyecto o desde backend ---
spring.config.import=optional:configtree:secrets/

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentfinder}
spring.datasource.username=${DB_USER:talentfinder}
spring.datasource.password=${db_password.txt}

# --- JPA: el esquema lo gestiona Flyway, Hibernate solo lo valida ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Errores: no filtrar información interna al cliente ---
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# --- Actuator: solo health expuesto ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Seguridad ---
app.security.jwt-secret=${jwt_secret.txt}
app.security.access-token-hours=4
app.security.allowed-origins=http://localhost:5173
app.security.cookie-secure=true
app.security.login-max-attempts=5
app.security.login-lock-minutes=15
spring.application.name=talentfinder

# --- Secretos: admite ejecutar desde la raíz del proyecto o desde backend ---
spring.config.import=optional:configtree:secrets/,optional:configtree:../secrets/

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentfinder}
spring.datasource.username=${DB_USER:talentfinder}
spring.datasource.password=${db_password.txt}

# --- JPA: el esquema lo gestiona Flyway, Hibernate solo lo valida ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Errores: no filtrar información interna al cliente ---
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# --- Actuator: solo health expuesto ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Seguridad ---
app.security.jwt-secret=${jwt_secret.txt}
app.security.access-token-hours=4
app.security.allowed-origins=http://localhost:5173
app.security.cookie-secure=true
app.security.login-max-attempts=5
app.security.login-lock-minutes=15

# --- Almacenamiento de CVs (compatible con S3) ---
app.storage.region=eu-south-2
app.storage.bucket=cvs
# En desarrollo apunta a SeaweedFS. En AWS esta propiedad se deja VACÍA (o se quita)
# y el SDK usa el endpoint real de S3.
app.storage.endpoint=http://localhost:8333
# En AWS, también vacías: el SDK usa el rol de IAM del servidor.
app.storage.access-key=${storage_access_key.txt:}
app.storage.secret-key=${storage_secret_key.txt:}

# --- Subida de archivos (CVs) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Embeddings (búsqueda semántica) ---
# Descárgalos con: bash scripts/fetch-models.sh
app.embedding.provider=onnx
app.embedding.model-id=intfloat/multilingual-e5-small@ffdcc22
app.embedding.dimensions=384
app.embedding.verify-on-startup=true

spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.onnx.model-uri=file:../models/multilingual-e5-small/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=file:../models/multilingual-e5-small/tokenizer.json
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.tokenizer.options.truncation=true
spring.ai.embedding.transformer.tokenizer.options.maxLength=512
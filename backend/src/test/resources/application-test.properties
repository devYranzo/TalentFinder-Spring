# La conexión real la inyecta Testcontainers; esto solo evita un placeholder sin resolver.
spring.datasource.password=unused-in-tests

# Secreto de firma SOLO para tests: 33 bytes en Base64. Nunca uses este valor fuera de aquí.
app.security.jwt-secret=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh

# Los tests no hablan con el almacén real: lo sustituye una copia en memoria.
app.storage.verify-on-startup=false
app.storage.endpoint=http://localhost:1

# Embeddings: en tests se usa un embebedor falso y no se carga el modelo real.
spring.ai.model.embedding=none
app.embedding.provider=fake
app.embedding.model-id=fake-bag-of-words
app.embedding.dimensions=384
app.embedding.verify-on-startup=false